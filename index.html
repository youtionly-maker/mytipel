<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>جدول الدوام</title>
<style>
:root{--bg:#000;--fg:#f2f2f2;--mute:#adadad;--line:#000000;--red:#ff1f1f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"GeezaPro",Tahoma,"Segoe UI",sans-serif;font-weight:400;font-synthesis:none;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:48px 22px 64px}
h1,p{margin:0;font-weight:400}
h1{font-size:clamp(26px,5.5vw,33px);line-height:1.2}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;color:var(--mute);font-size:15px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:36px}
.tab{font:inherit;font-size:14.5px;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:9px 0 7px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:color .2s,border-color .2s}
.tab:focus{outline:none}
.tab:focus-visible{color:var(--fg)}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--red)}
.dot{display:block;width:5px;height:5px;margin:5px auto 0;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);visibility:hidden}
.today .dot{visibility:visible}

.list{margin-top:32px;min-height:330px}
.r{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;padding:16px 0}
.r:nth-child(2n+3){border-top:1px solid var(--line)}
.n{color:var(--mute);font-size:14px}
.s{font-size:clamp(20px,4.6vw,24px);line-height:1.3}
.t{color:var(--mute);font-size:15px}
.r{cursor:pointer}
.r:focus{outline:none}
.r:focus-visible{outline:1px solid var(--line);outline-offset:-1px}
.r.open .n{color:var(--red)}
.more{grid-column:2/-1;margin-top:6px;color:var(--mute);font-size:14px}
.sep{display:inline-block;width:4px;height:4px;margin:0 9px;border-radius:50%;background:var(--red);vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>جدول الدوام</h1>
<div class="top"><p>قاعة ٥</p><p id="date"></p></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="list" id="list" role="tabpanel"></div>
</main>

<script>
const D="٠١٢٣٤٥٦٧٨٩",num=n=>String(n).replace(/\d/g,d=>D[d]);
const N=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];

// كل يوم: [المادة، المدرس] — حصة فارغة تُكتب null
const W=[
[["انكليزي","يسر"],["عربي","حيدر"],["رياضة","بهاء"],["احياء","سجاد"],["كردي","احمد"]],
[["رياضيات","علي"],["عربي","حيدر"],["انكليزي","يسر"],["اسلامية","اقبال"],["كيمياء","زينب"]],
[["فيزياء","بسمة"],["احياء","سجاد"],["رياضيات","علي"],["عربي","حيدر"],["فنية","عقيل"]],
[["رياضيات","علي"],["فيزياء","بسمة"],["انكليزي","يسر"],["احياء","سجاد"],["اسلامية","دنيا"]],
[["فيزياء","بسمة"],["كيمياء","زينب"],["رياضيات","علي"],["انكليزي","يسر"],null]
];

// وين تتكرر المادة بالأسبوع (بدون الحصة نفسها)
const where=(s,d,j)=>N.map((n,k)=>{
 const has=W[k].some((p,i)=>p&&p[0]===s&&!(k===d&&i===j));
 return has?n:null;
}).filter(Boolean);

const DAYS7=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];

const today=new Date().getDay();
const tabs=document.getElementById("tabs"),list=document.getElementById("list");
let cur=today<5?today:0;

tabs.innerHTML=N.map((n,i)=>`<button class="tab${i===today?" today":""}" role="tab" data-i="${i}">${n}<span class="dot"></span></button>`).join("");
const btns=[...tabs.children];

const dt=new Date();
document.getElementById("date").textContent=`${DAYS7[dt.getDay()]} ${num(dt.getDate())} ${MONTHS[dt.getMonth()]}`;

function show(i){
 cur=i;
 btns.forEach((b,k)=>{b.setAttribute("aria-selected",k===i);b.tabIndex=k===i?0:-1});
 list.innerHTML=W[i].map((p,j)=>p
  ?`<div class="r" data-j="${j}" tabindex="0" role="button" aria-expanded="false"><span class="n">${num(j+1)}</span><span class="s">${p[0]}</span><span class="t">${p[1]}</span></div>`
  :"").join("");
}
const go=n=>{n=Math.min(4,Math.max(0,n));if(n!==cur)show(n);return n};

tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(+b.dataset.i)});
tabs.addEventListener("keydown",e=>{
 const k={ArrowLeft:1,ArrowRight:-1}[e.key];if(!k)return;
 btns[go(cur+k)].focus();e.preventDefault();
});

// اضغط على أي درس لتشوف وين تتكرر مادته بالأسبوع
function toggle(r){
 const was=r.classList.contains("open");
 list.querySelectorAll(".r.open").forEach(x=>{x.classList.remove("open");x.setAttribute("aria-expanded","false");x.querySelector(".more").remove()});
 if(was)return;
 const j=+r.dataset.j,w=where(W[cur][j][0],cur,j);
 r.classList.add("open");r.setAttribute("aria-expanded","true");
 r.insertAdjacentHTML("beforeend",`<span class="more">${w.length?w.join('<i class="sep"></i>'):"—"}</span>`);
}
list.addEventListener("click",e=>{const r=e.target.closest(".r");if(r)toggle(r)});
list.addEventListener("keydown",e=>{
 if(e.key!=="Enter"&&e.key!==" ")return;
 const r=e.target.closest(".r");if(r){e.preventDefault();toggle(r)}
});

show(cur);
</script>
